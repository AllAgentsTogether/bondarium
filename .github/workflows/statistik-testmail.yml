name: Statistik – Testmail

# Schickt sofort einen Besucherbericht über den laufenden Tag an info@bondarium.com (seit 01.10.2026, docs/STATISTIK.md).
# Der Versand läuft über den Webserver bei STRATO (aufruf.php, aktion=testmail), genau wie der tägliche Bericht – so
# lässt sich die Zustellung prüfen. Schlüssel: derselbe wie für den 10-Uhr-Auslöser (TRIGGER_KEY). Höchstens einmal in
# fünf Minuten (sonst HTTP 429).
# Seit 02.10.2026 mit Auswahl „erinnerung“: statt des Berichts eine Beispiel-E-Mail „vor der Fälligkeit“ (erinnerung.php).
on:
  workflow_dispatch:
    inputs:
      art:
        description: "bericht = Besucherbericht, erinnerung = beide Beispiel-Erinnerungen (20 Tage vor und am Tag der Fälligkeit)"
        type: choice
        options: [bericht, erinnerung]
        default: bericht

permissions: {}

jobs:
  testmail:
    runs-on: ubuntu-24.04
    steps:
      - name: Testbericht anfordern
        env:
          TRIGGER_KEY: ${{ secrets.TRIGGER_KEY }}
          ART: ${{ inputs.art }}
        run: |
          KEY=$(printf '%s' "$TRIGGER_KEY" | tr -d '\r\n')
          code=$(curl -sS -o antwort.txt -w "%{http_code}" --max-time 90 -H "X-Trigger-Key: $KEY" --data "aktion=testmail" --data "art=${ART:-bericht}" https://www.bondarium.de/aufruf.php || true)
          echo "HTTP $code: $(cat antwort.txt 2>/dev/null)"
          [ "$code" = "200" ]
